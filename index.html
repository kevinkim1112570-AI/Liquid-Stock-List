<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Stock List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one column of brand groups. Each group is a header row (brand, totals, actions) above a responsive grid of stock cards. */
  :root {
    --bg: #ECEDE9;
    --surface: #F7F7F4;
    --ink: #22262A;
    --muted: #646A71;
    --line: #D8DAD4;
    --chip: #E2E4DE;
    --accent: #D24C06;
    --on-accent: #FFFFFF;
    --display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191B; --surface: #212427; --ink: #ECEDEA; --muted: #9EA3A9;
      --line: #32363A; --chip: #2C3033; --accent: #FF7A33; --on-accent: #1A1C1E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17191B; --surface: #212427; --ink: #ECEDEA; --muted: #9EA3A9;
    --line: #32363A; --chip: #2C3033; --accent: #FF7A33; --on-accent: #1A1C1E;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 17px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 64px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.05; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
  .totals { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .btn {
    border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 12px 20px; font-weight: 600; min-height: 48px;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(0.95); }

  /* Toolbar */
  .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 220px); gap: 12px; }
  .field {
    width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--surface);
  }
  .field::placeholder { color: var(--muted); }
  textarea.field { min-height: 88px; resize: vertical; }

  /* Sample notice */
  .notice {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
    padding: 12px 16px; border-radius: 10px; background: var(--chip); color: var(--muted);
  }
  .linkbtn { background: none; border: 0; padding: 6px 4px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }
  .linkbtn:hover { color: var(--accent); }

  /* Groups */
  .groups { display: flex; flex-direction: column; gap: 36px; }
  .group-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px;
    padding-bottom: 12px; border-bottom: 2px solid var(--ink); margin-bottom: 16px;
  }
  .brand { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; min-width: 0; }
  .twirl { align-self: center; width: 40px; height: 40px; margin-right: -6px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .twirl:hover { color: var(--accent); }
  .twirl .tri { width: 13px; height: 13px; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .twirl[aria-expanded="true"] .tri { width: 15px; height: 15px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .brand h2 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .actions .add-to { color: var(--accent); font-weight: 700; }
  .rename { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rename .field { min-height: 44px; width: min(320px, 100%); font-family: var(--display); font-weight: 700; font-size: 1.25rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
  }
  .card-top { display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: space-between; gap: 8px 12px; }
  .card h3 { margin: 0; font-size: 1.3rem; line-height: 1.25; font-weight: 700; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .card h3.long { font-size: 18.5px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 12px; font-size: 0.9rem; font-weight: 600; color: var(--ink); white-space: normal; flex: 0 0 auto; max-width: 45%; align-self: flex-start; }
  .detail { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .place { margin: 0; display: grid; gap: 2px; }
  .place dt { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .place dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .card-bottom { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--bg); font-size: 1.4rem; line-height: 1; font-weight: 600;
  }
  .stepper button:hover { border-color: var(--accent); color: var(--accent); }
  .stepper output { min-width: 3.2ch; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
  .note-box { flex: 1 1 100px; min-width: 100px; min-height: 64px; resize: vertical; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font-size: 0.95rem; line-height: 1.4; }
  .note-box::placeholder { color: var(--muted); }
  .card-bottom .links { flex: 0 0 100%; }
  .stepper .unit { color: var(--muted); font-size: 0.9rem; margin-left: 4px; }
  .links { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .confirm { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-weight: 600; }
  .confirm .yes { color: var(--accent); }

  .empty { text-align: center; padding: 56px 16px; border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .empty p { margin: 0; font-size: 1.1rem; }

  /* Form sheet */
  .overlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(20, 22, 24, 0.55);
    display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .sheet {
    background: var(--surface); border-radius: 16px; width: min(560px, 100%); margin: auto;
    padding: 24px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--line);
  }
  .sheet h2 { margin: 0; font-family: var(--display); font-size: 1.6rem; }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; min-width: 0; }
  label .hint { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  .err { margin: 0; color: var(--accent); font-weight: 600; min-height: 0; }
  .sheet-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
    background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 600;
    max-width: calc(100% - 32px);
  }

  @media (max-width: 560px) {
    .toolbar { grid-template-columns: minmax(0, 1fr); }
    .row2 { grid-template-columns: minmax(0, 1fr); }
    .top-right { width: 100%; }
    .top .btn.primary { flex: 1 1 100%; }
  }
  .specs { margin: 0; display: flex; flex-wrap: nowrap; align-items: flex-end; gap: 12px; }
  .specs > div { min-width: 0; }
  .specs > .place-cell { flex: 1 1 0; }
  .pic-cell { margin-left: auto; flex: 0 0 auto; }

  .specs dt { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .specs dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: break-word; }
  .btn.pic { min-height: 36px; padding: 4px 14px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; }
  .btn.pic:hover { border-color: var(--accent); color: var(--accent); }
  .stats { display: flex; align-items: stretch; gap: 8px; margin: 0; }
  .stats-grid { flex: 0 0 372px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; min-width: 0; align-content: start; }
  .stats-sep { flex: 0 0 3px; background: var(--ink); border-radius: 2px; margin: 0 4px; }
  .stats-places { flex: 1 1 0; min-width: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 35px; align-content: start; gap: 7px 5px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat-label { font-size: 0.62rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); font-weight: 600; line-height: 1.2; overflow-wrap: break-word; }
  .stat-num { font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.1; font-variant-numeric: tabular-nums; text-align: center; }
  .stat.zero .stat-num { color: var(--muted); }
  .ptile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 5px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .ptile .pl { font-size: 0.62rem; font-weight: 700; color: var(--muted); line-height: 1; letter-spacing: 0.02em; }
  .ptile .pn { font-family: var(--display); font-weight: 700; font-size: 0.95rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) {
    .stats { flex-wrap: wrap; }
    .stats-grid { flex: 1 1 100%; }
    .stats-sep { flex: 0 0 100%; height: 3px; margin: 4px 0; }
    .stats-places { flex: 1 1 100%; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); grid-auto-rows: 44px; }
  }
  .top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .userbar { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; }
  .user-email { overflow-wrap: anywhere; font-size: 0.95rem; }
  #app { display: flex; flex-direction: column; gap: 28px; }
  .auth { display: flex; justify-content: center; padding-top: 12px; }
  .authcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: min(460px, 100%); display: flex; flex-direction: column; gap: 16px; }
  .authcard h2 { margin: 0; font-family: var(--display); font-size: 1.6rem; line-height: 1.15; }
  .req { font-weight: 500; font-size: 0.85rem; color: var(--accent); }
  .hint { margin: 0; font-weight: 400; color: var(--muted); font-size: 0.95rem; }
  .info { margin: 0; color: var(--ink); font-weight: 600; }
  .info:empty, .err:empty { display: none; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color .15s ease; }
    .card:hover { border-color: var(--muted); }
  }
</style>

<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Liquid Stock List</h1>
      <p class="totals" id="totals"></p>
    </div>
    <div class="top-right">
      <div class="userbar" id="userbar" hidden>
        <span id="user-email" class="user-email"></span>
        <button class="linkbtn" type="button" data-action="signout">Sign out</button>
      </div>
      <button class="btn primary" type="button" data-action="add">+ Add New</button>
    </div>
  </header>

  <section class="auth" id="auth" hidden>
    <form class="authcard" id="auth-form" novalidate>
      <h2>Sign in to your team stock list</h2>
      <p class="hint">Use your team email. New here? Create an account with the same fields.</p>
      <label for="a-email">Email
        <input class="field" id="a-email" type="email" autocomplete="email" placeholder="name@company.com">
      </label>
      <label for="a-pass">Password <span class="hint">6 or more characters</span>
        <input class="field" id="a-pass" type="password" autocomplete="current-password">
      </label>
      <p class="err" id="auth-err" role="alert"></p>
      <p class="info" id="auth-info" role="status"></p>
      <div class="sheet-actions">
        <button class="btn" type="button" id="btn-signup">Create account</button>
        <button class="btn primary" type="submit" id="btn-signin">Sign in</button>
      </div>
    </form>
  </section>

  <div id="app" hidden>
  <div class="toolbar">
    <input class="field" id="q" type="search" placeholder="Search brand, expression, place, detail" aria-label="Search stock">
    <select class="field" id="tf" aria-label="Filter by category"></select>
  </div>

  <section class="stats" id="stats" aria-label="Stock summary"></section>

  <div id="notice"></div>
  <main class="groups" id="groups"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" novalidate>
    <h2 id="form-title">Add liquid</h2>
    <label for="f-brand">Spirit Brand <span class="req">required</span>
      <input class="field" id="f-brand" list="dl-brands" autocomplete="off" placeholder="e.g. Macallan">
    </label>
    <div class="row2">
      <label for="f-range">Expression <span class="req">required</span>
        <input class="field" id="f-range" autocomplete="off" placeholder="e.g. 12yrs">
      </label>
      <label for="f-type">Category <span class="req">required</span>
        <input class="field" id="f-type" list="dl-types" autocomplete="off" placeholder="e.g. Whisky">
      </label>
    </div>
    <div class="row2">
      <label for="f-capacity">Capacity <span class="hint">Optional</span>
        <input class="field" id="f-capacity" autocomplete="off" placeholder="e.g. 700 ml">
      </label>
      <label for="f-abv">ABV % <span class="hint">Alcohol by volume, optional</span>
        <input class="field" id="f-abv" type="number" min="0" max="100" step="0.1" inputmode="decimal" placeholder="e.g. 40">
      </label>
    </div>
    <label for="f-detail">Detail <span class="hint">Optional. Size, grade, batch, notes.</span>
      <textarea class="field" id="f-detail" placeholder="e.g. fully synthetic"></textarea>
    </label>
    <label for="f-image">Picture link <span class="hint">Optional. A web address starting with https://</span>
      <input class="field" id="f-image" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com/bottle.jpg">
    </label>
    <div class="row2">
      <label for="f-place">Place of Stock <span class="hint">Optional</span>
        <input class="field" id="f-place" list="dl-places" autocomplete="off" placeholder="e.g. A1">
      </label>
      <label for="f-qty">Quantity <span class="req">required</span>
        <input class="field" id="f-qty" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
      </label>
    </div>
    <p class="err" id="form-dup" role="alert"></p>
    <p class="err" id="form-err" role="alert"></p>
    <div class="sheet-actions">
      <button class="btn" type="button" data-action="modal-close">Cancel</button>
      <button class="btn primary" type="submit" id="f-save">Save</button>
    </div>
  </form>
</div>

<datalist id="dl-brands"></datalist>
<datalist id="dl-types"></datalist>
<datalist id="dl-places"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://gxbhnrovgtiylqsukshm.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_XbUUGZiSK3Se4QaC54JE2g_eKxVrcvs';

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function keyOf(b) { return String(b).trim().toLowerCase(); }

  if (!window.supabase) {
    $('#auth').hidden = false;
    $('#auth-err').textContent = 'Could not load the database library. Check your connection and reload.';
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var items = [];
  var session = null;
  var loading = false;
  var loadError = '';
  var channel = null;
  var refetchTimer = null;
  // Brand groups start closed. open[key] holds a choice made with the arrow; while a search or
  // filter is active, groups without a choice open by themselves so the matches are visible.
  var open = {};
  function isOpen(key) {
    if (Object.prototype.hasOwnProperty.call(open, key)) return open[key];
    return !!($('#q').value.trim() || $('#tf').value);
  }
  var renamingKey = null;
  var confirmBrand = null;
  var confirmItem = null;
  var editingId = null;
  var toastTimer = null;

  function fromRow(r) {
    return { id: r.id, brand: r.brand, model: r.model, type: r.liquid_type, detail: r.detail || '', capacity: r.capacity || '', abv: r.abv, image: r.image_url || '', note: r.note || '', place: r.stock_place, qty: r.quantity, sample: r.is_sample };
  }
  function safeUrl(u) {
    try { var x = new URL(String(u).trim()); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; }
    catch (e) { return ''; }
  }
  function abvText(v) { return v === null || v === undefined || v === '' ? '' : (Number(v) + '%'); }
  function find(id) { for (var n = 0; n < items.length; n++) if (items[n].id === id) return items[n]; return null; }

  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------- Data ---------- */
  function fetchAll(quiet) {
    if (!session) return;
    if (!quiet) { loading = true; loadError = ''; render(); }
    sb.from('liquid_stock').select('*').order('brand', { ascending: true }).then(function (res) {
      loading = false;
      if (res.error) { loadError = res.error.message; if (quiet) toast('Could not refresh: ' + res.error.message); }
      else { loadError = ''; items = res.data.map(fromRow); }
      render();
    });
  }
  function scheduleRefetch() {
    clearTimeout(refetchTimer);
    refetchTimer = setTimeout(function () { fetchAll(true); }, 250);
  }
  function subscribe() {
    unsubscribe();
    channel = sb.channel('liquid_stock_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'liquid_stock' }, scheduleRefetch)
      .subscribe();
  }
  function unsubscribe() {
    if (channel) { sb.removeChannel(channel); channel = null; }
  }
  // Runs a write. On failure, shows the reason and reloads the true state from the database.
  function write(promise, okMsg) {
    return promise.then(function (res) {
      if (res.error) {
        toast(res.error.code === '23505' ? 'Not saved: that expression already exists under this brand.' : 'Not saved: ' + res.error.message);
        fetchAll(true); return false;
      }
      if (okMsg) toast(okMsg);
      return true;
    });
  }

  /* ---------- Auth ---------- */
  function applySession() {
    var signedIn = !!session;
    $('#auth').hidden = signedIn;
    $('#app').hidden = !signedIn;
    $('#userbar').hidden = !signedIn;
    if (signedIn) {
      $('#user-email').textContent = session.user.email || '';
      subscribe();
      fetchAll();
    } else {
      unsubscribe();
      items = [];
    }
  }
  sb.auth.getSession().then(function (r) {
    session = r.data.session;
    applySession();
  });
  sb.auth.onAuthStateChange(function (event, s) {
    // Defer so no database call runs inside the auth callback.
    setTimeout(function () {
      var changed = (!!s) !== (!!session) || (s && session && s.user.id !== session.user.id);
      session = s;
      if (changed) applySession();
    }, 0);
  });

  function authBusy(b) {
    $('#btn-signin').disabled = b; $('#btn-signup').disabled = b;
  }
  $('#auth-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('#a-email').value.trim(), pw = $('#a-pass').value;
    $('#auth-err').textContent = ''; $('#auth-info').textContent = '';
    if (!email || !pw) { $('#auth-err').textContent = 'Enter your email and password.'; return; }
    authBusy(true);
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function (r) {
      authBusy(false);
      if (r.error) $('#auth-err').textContent = r.error.message;
    });
  });
  $('#btn-signup').addEventListener('click', function () {
    var email = $('#a-email').value.trim(), pw = $('#a-pass').value;
    $('#auth-err').textContent = ''; $('#auth-info').textContent = '';
    if (!email || pw.length < 6) { $('#auth-err').textContent = 'Enter an email and a password of 6 or more characters.'; return; }
    authBusy(true);
    sb.auth.signUp({ email: email, password: pw }).then(function (r) {
      authBusy(false);
      if (r.error) { $('#auth-err').textContent = r.error.message; return; }
      if (!r.data.session) $('#auth-info').textContent = 'Account created. Check your email to confirm it, then sign in.';
    });
  });

  /* ---------- Rendering ---------- */
  function fillLists() {
    var brands = {}, types = {}, places = {};
    items.forEach(function (i) { brands[i.brand] = 1; types[i.type] = 1; places[i.place] = 1; });
    var opt = function (o) { return Object.keys(o).sort().map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join(''); };
    $('#dl-brands').innerHTML = opt(brands);
    $('#dl-types').innerHTML = opt(types);
    $('#dl-places').innerHTML = opt(places);

    var tf = $('#tf'), cur = tf.value;
    var usedTypes = {};
    items.forEach(function (i) { usedTypes[i.type] = 1; });
    var names = Object.keys(usedTypes).sort();
    tf.innerHTML = '<option value="">All categories</option>' + names.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    }).join('');
    tf.value = names.indexOf(cur) >= 0 ? cur : '';
  }

  var renderPending = false;
  // Compare names ignoring case, spaces and punctuation; Chinese characters are kept.
  function norm(v) { return String(v == null ? '' : v).toLowerCase().replace(/[^\p{L}\p{N}]/gu, ''); }
  function renderStats() {
    var qty = function (i) { return Number(i.qty) || 0; };
    var sum = function (fn) { return items.reduce(function (t, i) { return fn(i) ? t + qty(i) : t; }, 0); };
    // Each box adds up the units whose Category or Spirit Brand is that name.
    var byName = function (name) {
      var n = norm(name);
      return sum(function (i) { return norm(i.type) === n || norm(i.brand) === n; });
    };
    var names = [
      'Whisky', 'E-Whisky', 'Macallan',
      'Brandy', 'E-Brandy', 'Martell',
      'D.O.M.', '\u8305\u53F0-\u652F', 'Hennessy',
      '\u767D\u9152', '\u8305\u53F0-\u7BB1', 'Wine'
    ];
    var grid = names.map(function (nm) { return [nm, byName(nm)]; });
    var tile = function (t) {
      return '<div class="stat' + (t[1] === 0 ? ' zero' : '') + '"><span class="stat-label">' + esc(t[0]) + '</span><span class="stat-num">' + t[1] + '</span></div>';
    };
    // Stock places are letter A-L (12 columns) + number 1-4 (4 rows), e.g. A1, C3, L4.
    var letters = 'ABCDEFGHIJKL', byPlace = {};
    items.forEach(function (i) {
      var m = /^([A-L])\s*-?\s*([1-4])$/i.exec(String(i.place || '').trim());
      if (m) { var k = m[1].toUpperCase() + m[2]; byPlace[k] = (byPlace[k] || 0) + qty(i); }
    });
    // Only places that hold stock are shown, in order (A1, A2, A4, B2, D3 ...), with no gaps.
    var cells = '';
    for (var c = 0; c < letters.length; c++) {
      for (var r = 1; r <= 4; r++) {
        var code = letters.charAt(c) + r, n = byPlace[code] || 0;
        if (n > 0) cells += '<div class="ptile"><span class="pl">' + code + '</span><span class="pn">' + n + '</span></div>';
      }
    }
    $('#stats').innerHTML =
      '<div class="stats-grid">' + grid.map(tile).join('') + '</div>' +
      '<div class="stats-sep" aria-hidden="true"></div>' +
      '<div class="stats-places" aria-label="Units by stock place">' + cells + '</div>';
  }
  function fitTitles() {
    var hs = document.querySelectorAll('.card h3');
    for (var n = 0; n < hs.length; n++) {
      var h = hs[n];
      h.classList.remove('long');
      h.style.whiteSpace = 'nowrap';
      var tooLong = h.scrollWidth > h.clientWidth + 1;
      h.style.whiteSpace = '';
      if (tooLong) h.classList.add('long');
    }
  }
  window.addEventListener('resize', fitTitles);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitles);
  function render() { renderInner(); renderStats(); fitTitles(); }
  function renderInner() {
    if (!session) return;
    var ae = document.activeElement;
    if (ae && ae.classList && ae.classList.contains('note-box')) { renderPending = true; return; }
    renderPending = false;
    fillLists();
    var host = $('#groups');

    var brandSet = {}; items.forEach(function (i) { brandSet[keyOf(i.brand)] = 1; });
    var totalQty = items.reduce(function (s, i) { return s + (Number(i.qty) || 0); }, 0);
    $('#totals').textContent = loading ? 'Loading stock…' :
      (function (b, e, u) { return b + (b === 1 ? ' brand' : ' brands') + ' · ' + e + (e === 1 ? ' expression' : ' expressions') + ' · ' + u + (u === 1 ? ' unit' : ' units') + ' in stock'; })(Object.keys(brandSet).length, items.length, totalQty);

    var hasSample = items.some(function (i) { return i.sample; });
    $('#notice').innerHTML = hasSample
      ? '<div class="notice"><span>These are example entries. Replace them with your own stock.</span><button class="linkbtn" type="button" data-action="clear-samples">Remove examples</button></div>'
      : '';

    if (loading && !items.length) { host.innerHTML = '<div class="empty"><p>Loading stock…</p></div>'; return; }
    if (loadError && !items.length) {
      host.innerHTML = '<div class="empty"><p>Could not load stock: ' + esc(loadError) + '</p><button class="btn" type="button" data-action="retry">Try again</button></div>';
      return;
    }

    var q = $('#q').value.trim().toLowerCase();
    var tf = $('#tf').value;
    var filtered = items.filter(function (i) {
      if (tf && i.type !== tf) return false;
      if (!q) return true;
      return [i.brand, i.model, i.type, i.detail, i.place, i.capacity, abvText(i.abv), i.note].join(' ').toLowerCase().indexOf(q) >= 0;
    });

    if (!items.length) {
      host.innerHTML = '<div class="empty"><p>No liquids listed yet. Add your first brand and expression.</p><button class="btn primary" type="button" data-action="add">+ Add New</button></div>';
      return;
    }
    if (!filtered.length) {
      host.innerHTML = '<div class="empty"><p>Nothing matches your search.</p></div>';
      return;
    }

    var groups = {};
    filtered.forEach(function (i) {
      var k = keyOf(i.brand);
      if (!groups[k]) groups[k] = { key: k, name: i.brand, list: [] };
      groups[k].list.push(i);
    });
    var ordered = Object.keys(groups).sort().map(function (k) { return groups[k]; });

    host.innerHTML = ordered.map(function (g) {
      var qty = g.list.reduce(function (s, i) { return s + (Number(i.qty) || 0); }, 0);
      var isOpenG = isOpen(g.key);
      var head;
      if (renamingKey === g.key) {
        head = '<div class="rename"><input class="field" id="rename-input" value="' + esc(g.name) + '" aria-label="Brand name">' +
          '<button class="btn primary" type="button" data-action="rename-save" data-key="' + esc(g.key) + '">Save</button>' +
          '<button class="btn" type="button" data-action="rename-cancel">Cancel</button></div>';
      } else {
        head = '<div class="brand"><button class="twirl" type="button" data-action="brand-toggle" data-key="' + esc(g.key) + '" aria-expanded="' + isOpenG + '" aria-label="' + (isOpenG ? 'Collapse ' : 'Expand ') + esc(g.name) + '"><span class="tri" aria-hidden="true"></span></button><h2>' + esc(g.name) + '</h2><span class="meta">' + g.list.length + (g.list.length === 1 ? ' expression' : ' expressions') + ' · ' + qty + ' units</span></div>';
      }
      var actions;
      if (confirmBrand === g.key) {
        actions = '<div class="confirm">Delete ' + esc(g.name) + ' and ' + g.list.length + (g.list.length === 1 ? ' expression?' : ' expressions?') +
          '<button class="linkbtn yes" type="button" data-action="brand-del-yes" data-key="' + esc(g.key) + '">Yes, delete</button>' +
          '<button class="linkbtn" type="button" data-action="brand-del-no">Keep</button></div>';
      } else {
        actions = '<button class="linkbtn add-to" type="button" data-action="add-to" data-brand="' + esc(g.name) + '">+ Add expression</button>' +
          '<button class="linkbtn" type="button" data-action="brand-rename" data-key="' + esc(g.key) + '">Rename</button>' +
          '<button class="linkbtn" type="button" data-action="brand-del-ask" data-key="' + esc(g.key) + '">Delete brand</button>';
      }
      var cards = !isOpenG ? '' : '<div class="grid">' + g.list.sort(function (a, b) { return a.model.localeCompare(b.model); }).map(cardHtml).join('') + '</div>';
      return '<section aria-label="' + esc(g.name) + '"><div class="group-head">' + head + (isOpenG ? '<div class="actions">' + actions + '</div>' : '') + '</div>' + cards + '</section>';
    }).join('');

    var ri = $('#rename-input');
    if (ri && document.activeElement !== ri) { ri.focus(); ri.select(); }
  }

  function cardHtml(i) {
    var del = confirmItem === i.id
      ? '<div class="confirm">Delete?<button class="linkbtn yes" type="button" data-action="del-yes" data-id="' + i.id + '">Yes</button><button class="linkbtn" type="button" data-action="del-no">No</button></div>'
      : '<button class="linkbtn" type="button" data-action="edit" data-id="' + i.id + '">Edit</button><button class="linkbtn" type="button" data-action="del-ask" data-id="' + i.id + '">Delete</button>';
    return '<article class="card">' +
      '<div class="card-top"><h3>' + esc(i.model) + '</h3><span class="chip">' + esc(i.type) + '</span></div>' +
      '<dl class="specs' + ((i.capacity || abvText(i.abv)) ? '' : ' solo') + (safeUrl(i.image) ? ' haspic' : '') + '">' +
        ((i.capacity || abvText(i.abv)) ? '<div><dt>Capacity</dt><dd>' + (esc(i.capacity) || '\u2014') + '</dd></div><div><dt>ABV</dt><dd>' + (abvText(i.abv) || '\u2014') + '</dd></div>' : '') +
        '<div class="place-cell"><dt>Place</dt><dd>' + (esc(i.place) || '\u2014') + '</dd></div>' +
        (safeUrl(i.image) ? '<div class="pic-cell"><a class="btn pic" href="' + esc(safeUrl(i.image)) + '" target="_blank" rel="noopener noreferrer" aria-label="View picture of ' + esc(i.model) + '">pic</a></div>' : '') +
        '</dl>' +
      (i.detail ? '<p class="detail">' + esc(i.detail) + '</p>' : '') +
      '<div class="card-bottom">' +
        '<div class="stepper"><button type="button" aria-label="Remove one from ' + esc(i.model) + '" data-action="dec" data-id="' + i.id + '">−</button>' +
        '<output>' + (Number(i.qty) || 0) + '</output>' +
        '<button type="button" aria-label="Add one to ' + esc(i.model) + '" data-action="inc" data-id="' + i.id + '">+</button></div>' +
        '<textarea class="note-box" rows="2" maxlength="500" placeholder="Note" aria-label="Note for ' + esc(i.model) + '" data-id="' + i.id + '">' + esc(i.note) + '</textarea>' +
        '<div class="links">' + del + '</div>' +
      '</div></article>';
  }

  /* ---------- Form ---------- */
  function openForm(item, brand) {
    editingId = item ? item.id : null;
    $('#form-title').textContent = item ? 'Edit liquid' : (brand ? 'Add expression to ' + brand : 'Add liquid');
    $('#f-brand').value = item ? item.brand : (brand || '');
    $('#f-range').value = item ? item.model : '';
    $('#f-type').value = item ? item.type : '';
    $('#f-detail').value = item ? item.detail : '';
    $('#f-capacity').value = item ? item.capacity : '';
    $('#f-abv').value = item && item.abv !== null && item.abv !== undefined ? item.abv : '';
    $('#f-image').value = item ? item.image : '';
    $('#f-place').value = item ? item.place : '';
    $('#f-qty').value = item ? item.qty : '';
    $('#form-err').textContent = '';
    saving = false; updateSave();
    $('#overlay').hidden = false;
    (brand && !item ? $('#f-range') : $('#f-brand')).focus();
  }
  function formComplete() {
    var q = $('#f-qty').value.trim(), n = Number(q);
    return $('#f-brand').value.trim() !== '' && $('#f-range').value.trim() !== '' && $('#f-type').value.trim() !== '' &&
      q !== '' && isFinite(n) && n >= 0 && Math.floor(n) === n;
  }
  function findDuplicate() {
    var b = keyOf($('#f-brand').value), r = keyOf($('#f-range').value);
    if (!b || !r) return null;
    for (var n = 0; n < items.length; n++) {
      if (items[n].id !== editingId && keyOf(items[n].brand) === b && keyOf(items[n].model) === r) return items[n];
    }
    return null;
  }
  function updateSave() {
    var d = findDuplicate();
    $('#form-dup').textContent = d ? 'The expression \u201C' + d.model + '\u201D already exists under ' + d.brand + '. Change the expression name, or edit the existing one.' : '';
    $('#f-save').disabled = saving || !formComplete() || !!d;
  }
  var saving = false;
  $('#form').addEventListener('input', updateSave);
  $('#form').addEventListener('change', updateSave);
  function closeForm() { $('#overlay').hidden = true; editingId = null; }

  $('#form').addEventListener('submit', function (e) {
    e.preventDefault();
    var brand = $('#f-brand').value.trim();
    var model = $('#f-range').value.trim();
    var type = $('#f-type').value.trim();
    var detail = $('#f-detail').value.trim();
    var place = $('#f-place').value.trim();
    var capacity = $('#f-capacity').value.trim();
    var abvRaw = $('#f-abv').value.trim();
    var abv = abvRaw === '' ? null : Number(abvRaw);
    var image = $('#f-image').value.trim();
    var qtyRaw = $('#f-qty').value.trim();
    var qty = Number(qtyRaw);
    var err = '';
    if (!brand) err = 'Enter the spirit brand.';
    else if (!model) err = 'Enter the expression.';
    else if (!type) err = 'Enter the category.';
    else if (qtyRaw === '' || !isFinite(qty) || qty < 0 || Math.floor(qty) !== qty) err = 'Quantity must be a whole number, 0 or more.';
    if (!err && abv !== null && (!isFinite(abv) || abv < 0 || abv > 100)) err = 'ABV must be a number from 0 to 100.';
    if (!err && image && !safeUrl(image)) err = 'Enter a picture link that starts with http:// or https://.';
    if (err) { $('#form-err').textContent = err; return; }

    var dup = findDuplicate();
    if (dup) { updateSave(); return; }
    // Keep one spelling per brand: reuse the existing name if only the case differs.
    var existing = items.filter(function (i) { return keyOf(i.brand) === keyOf(brand) && i.id !== editingId; })[0];
    if (existing) brand = existing.brand;

    var row = { brand: brand, model: model, liquid_type: type, detail: detail, stock_place: place, quantity: qty, capacity: capacity, abv: abv, image_url: image ? safeUrl(image) : '' };
    var req, msg;
    if (editingId) {
      row.is_sample = false;
      req = sb.from('liquid_stock').update(row).eq('id', editingId);
      msg = 'Saved changes to ' + model;
    } else {
      req = sb.from('liquid_stock').insert(row);
      msg = 'Added ' + model + ' to ' + brand;
    }
    saving = true; updateSave();
    write(req, msg).then(function (ok) {
      saving = false; updateSave();
      if (ok) { open[keyOf(brand)] = true; closeForm(); fetchAll(true); }
      else { $('#form-err').textContent = 'Could not save. Check your connection and try again.'; }
    });
  });

  $('#overlay').addEventListener('mousedown', function (e) { if (e.target === this) closeForm(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#overlay').hidden) closeForm();
    if (e.key === 'Enter' && e.target && e.target.id === 'rename-input') {
      var b = document.querySelector('[data-action="rename-save"]'); if (b) b.click();
    }
  });
  $('#q').addEventListener('input', render);
  $('#tf').addEventListener('change', render);

  /* ---------- Notes ---------- */
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains('note-box')) return;
    var it = find(t.getAttribute('data-id'));
    if (!it) return;
    var v = t.value.trim();
    if (v === it.note) return;
    it.note = v; it.sample = false;
    write(sb.from('liquid_stock').update({ note: v, is_sample: false }).eq('id', it.id), 'Note saved');
  });
  document.addEventListener('focusout', function (e) {
    if (e.target.classList && e.target.classList.contains('note-box') && renderPending) {
      setTimeout(function () { if (renderPending) render(); }, 0);
    }
  });

  /* ---------- Actions ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');
    var key = el.getAttribute('data-key');
    var it, ids;

    if (a === 'add') openForm(null, '');
    else if (a === 'add-to') openForm(null, el.getAttribute('data-brand'));
    else if (a === 'modal-close') closeForm();
    else if (a === 'signout') sb.auth.signOut();
    else if (a === 'retry') fetchAll();
    else if (a === 'edit') openForm(find(id), '');
    else if (a === 'inc' || a === 'dec') {
      it = find(id); if (!it) return;
      var next = Math.max(0, (Number(it.qty) || 0) + (a === 'inc' ? 1 : -1));
      it.qty = next; it.sample = false; render();
      write(sb.from('liquid_stock').update({ quantity: next, is_sample: false }).eq('id', id));
    }
    else if (a === 'del-ask') { confirmItem = id; render(); }
    else if (a === 'del-no') { confirmItem = null; render(); }
    else if (a === 'del-yes') {
      it = find(id);
      items = items.filter(function (i) { return i.id !== id; });
      confirmItem = null; render();
      write(sb.from('liquid_stock').delete().eq('id', id), 'Deleted ' + (it ? it.model : 'item'));
    }
    else if (a === 'brand-toggle') { open[key] = !isOpen(key); if (!open[key] && confirmBrand === key) confirmBrand = null; render(); }
    else if (a === 'brand-rename') { renamingKey = key; confirmBrand = null; render(); }
    else if (a === 'rename-cancel') { renamingKey = null; render(); }
    else if (a === 'rename-save') {
      var nv = $('#rename-input').value.trim();
      if (!nv) return;
      ids = items.filter(function (i) { return keyOf(i.brand) === key; }).map(function (i) { return i.id; });
      if (Object.prototype.hasOwnProperty.call(open, key)) { open[keyOf(nv)] = open[key]; delete open[key]; }
      items.forEach(function (i) { if (keyOf(i.brand) === key) { i.brand = nv; i.sample = false; } });
      renamingKey = null; render();
      write(sb.from('liquid_stock').update({ brand: nv, is_sample: false }).in('id', ids), 'Renamed brand to ' + nv);
    }
    else if (a === 'brand-del-ask') { confirmBrand = key; render(); }
    else if (a === 'brand-del-no') { confirmBrand = null; render(); }
    else if (a === 'brand-del-yes') {
      ids = items.filter(function (i) { return keyOf(i.brand) === key; }).map(function (i) { return i.id; });
      items = items.filter(function (i) { return keyOf(i.brand) !== key; });
      confirmBrand = null; render();
      write(sb.from('liquid_stock').delete().in('id', ids), 'Brand deleted');
    }
    else if (a === 'clear-samples') {
      items = items.filter(function (i) { return !i.sample; }); render();
      write(sb.from('liquid_stock').delete().eq('is_sample', true), 'Examples removed');
    }
  });
})();
</script>
</body>
</html>
